name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - run: uv sync --locked --extra dev
      - run: uv run --extra dev python -m playwright install --with-deps chromium
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run --extra dev mypy src/lead_enricher
      - run: uv run --extra dev pytest -q
      - run: uv run python -m lead_enricher demo --output artifacts/ci_demo.json
      - run: uv run python -m lead_enricher validate-output artifacts/ci_demo.json
