[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadlens"
version = "0.1.0"
description = "Bounded browser-based company lead enrichment with traceable evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.50,<2", "beautifulsoup4>=4.12,<5", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "openai>=1.70,<3", "httpx>=0.28,<1",
  "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-beautifulsoup4"]

[project.scripts]
leadlens = "lead_enricher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_enricher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: real Chromium against a local HTTP server"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv-*", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
